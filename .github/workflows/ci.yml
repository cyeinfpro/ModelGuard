name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: modelguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make test
      - run: make check-package
      - run: make package
      - run: make verify-package
      - uses: actions/upload-artifact@v4
        with:
          name: ModelGuard-linux-runtimes
          path: build/guard-linux-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ModelGuard-release-package
          path: |
            dist/ModelGuard-*.s2plugin
            dist/SHA256SUMS
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ModelGuard-release-package
          path: dist
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG"
